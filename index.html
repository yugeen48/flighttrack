<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Der Himmel über dir</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1B1B1A">
<meta name="apple-mobile-web-app-title" content="FlightTrack">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root{
    --ink:#1A1A18;
    --panel:#F2EFE4;
    --panel-soft:#7C776C;
    --sun:#E0AE3C;
    --needle:#B4232A;
    --accent:#1F4E5F;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    --t: 560ms cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:#141413;color:var(--ink);font-family:var(--sans);
    -webkit-text-size-adjust:100%;overflow:hidden;
    display:grid;place-items:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .frame{
    position:relative;width:100%;height:100%;
    display:flex;flex-direction:column;overflow:hidden;background:var(--panel);
  }

  /* ---------------- Himmel ---------------- */
  .sky{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
  .bands{position:absolute;inset:0;
    background:linear-gradient(to bottom,#AEBCCB 0%,#B9C6D3 20%,#C7D0D9 40%,
      #D6DBDD 60%,#E3E2D9 80%,#EAE7DC 100%)}
  .bands i{display:none}
  .glow{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,rgba(255,255,255,.30),transparent 62%);pointer-events:none}

  .cloud{position:absolute;fill:#F6F4EC}
  .cloud.c1{width:20%;left:9%;top:22%}
  .cloud.c2{width:15%;left:57%;top:9%;fill:#FBFAF3}
  .cloud.c3{width:17%;left:72%;top:52%;fill:#EFEDE4}
  .sun{position:absolute;right:7%;top:11%;width:9.5%;aspect-ratio:1;border-radius:50%;
       background:var(--sun);border:2.5px solid var(--ink)}

  /* Kopfzeile */
  .top{
    position:absolute;left:0;right:0;top:0;z-index:3;
    display:flex;align-items:center;gap:14px;padding:18px 26px;
    font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#4A4F57;
  }
  .top .here{flex:1 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .top .live{flex:0 0 auto}
  .top .live b{font-weight:400;color:var(--ink)}

  .place{
    width:40px;height:40px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.72);border:1px solid rgba(26,26,24,.18);color:#6E7580;cursor:pointer;
    transition:color var(--t),border-color var(--t),background var(--t),transform 220ms;
  }
  .place svg{width:20px;height:20px;display:block;fill:currentColor}
  .place[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);background:#fff}
  .place:active{transform:scale(.93)}
  .place:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  /* Flugzeug */
  .radius{display:inline-flex;gap:2px;flex:0 0 auto;background:rgba(255,255,255,.55);
    border:1px solid rgba(26,26,24,.16);border-radius:999px;padding:2px}
  .radius button{border:0;background:none;font:inherit;font-size:10px;letter-spacing:.06em;
    color:inherit;opacity:.55;padding:3px 8px;border-radius:999px;cursor:pointer}
  .radius button[aria-pressed="true"]{opacity:1;background:rgba(26,26,24,.10);font-weight:600}
  .night .radius{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22)}
  .night .radius button[aria-pressed="true"]{background:rgba(255,255,255,.22)}

  .funk{flex:0 0 auto;border:0;background:none;padding:4px;cursor:pointer;color:inherit;opacity:.55}
  .funk svg{width:17px;height:17px;display:block;fill:currentColor}
  .funk[aria-pressed="true"]{opacity:1;color:var(--needle)}
  .funk.speaking{animation:funkPulse 900ms ease-in-out infinite}
  @keyframes funkPulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){ .funk.speaking{animation:none} }
  .mute{flex:0 0 auto;border:0;background:none;padding:4px;cursor:pointer;color:inherit;opacity:.6}
  .mute svg{width:17px;height:17px;display:block;fill:currentColor}
  .mute .off{display:none}
  .mute[aria-pressed="true"]{opacity:.95}
  .mute[aria-pressed="false"] .wave{display:none}
  .mute[aria-pressed="false"] .off{display:block}

  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2C7A4B;
    vertical-align:middle;margin:0 2px;animation:dotPulse 2.6s ease-in-out infinite}
  .dot.load{background:#D8A31A;animation-duration:1.1s}
  .dot.err{background:#C0392B;animation-duration:.9s}
  @keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){ .dot{animation:none} }

  .craft{
    position:absolute;z-index:2;left:50%;top:52%;width:76%;max-width:900px;
    transform:translate(-50%,-50%);transition:opacity var(--t);
  }
  .craft svg{width:100%;height:auto;display:block;overflow:visible}
  .craft.hide{opacity:0}
  .craft{cursor:pointer;pointer-events:auto}
  .blink{animation:blink 1.5s steps(1,end) infinite}
  @keyframes blink{0%,8%{opacity:1}9%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){ .blink{animation:none;opacity:.9} }
  /* Zweite Maschine: kleiner, höher, blasser - liegt hinter der ersten */
  .craft2{
    position:absolute;z-index:1;left:29%;top:15%;width:25%;max-width:300px;
    transform:translate(-50%,-50%);opacity:.4;transition:opacity var(--t);
  }
  .craft2 svg{width:100%;height:auto;display:block;overflow:visible}
  .craft2.hide{opacity:0}

  /* Leerer Himmel */
  .empty{
    position:absolute;z-index:2;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;text-align:center;
    opacity:0;transition:opacity var(--t);pointer-events:none;padding:0 30px;
  }
  .empty.show{opacity:1}
  .empty h2{margin:0;font-size:clamp(24px,4.4vw,44px);font-weight:700;letter-spacing:-.02em}
  .empty p{margin:2px 0 0;font-size:clamp(13px,1.9vw,19px);font-weight:600;color:#5B6068}
  .empty .temp{margin-top:16px;font-size:clamp(42px,8vw,84px);font-weight:700;letter-spacing:-.04em;line-height:1}
  .empty .temp span{color:#6E7480;font-weight:300}
  .empty .cond{margin-top:6px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#5B6068}

  /* ---------------- Nacht ---------------- */
  .frame.night .bands{background:linear-gradient(to bottom,#131A2B 0%,#182136 20%,
    #1E2840 40%,#25304A 60%,#2C3852 80%,#333F59 100%)}
  .frame.night .glow{background:radial-gradient(120% 90% at 78% 18%,rgba(200,215,255,.16),transparent 60%)}
  .frame.night .cloud{fill:#3A465F !important;opacity:.75}
  .moon{display:none;position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px)}
  .night .sun{background:none;border-color:transparent}
  .night .moon{display:block}
  .night .top{color:#9FB0CC}
  .night .top .live b{color:#E6ECF7}
  .night .place{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.28);color:#9FB0CC}
  .night .place[aria-pressed="true"]{background:rgba(255,255,255,.92);border-color:#fff;color:#16202F}
  .night .empty h2{color:#EEF2FA}
  .night .empty p{color:#A9B8D2}
  .night .empty .temp{color:#fff}
  .night .empty .temp span{color:#8FA0BD}
  .night .empty .cond{color:#A9B8D2}
  /* ---------------- Wind und Gesichter ---------------- */
  .wind{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;
        opacity:0;transition:opacity 900ms ease-out}
  .wind.on{opacity:1}
  .streak{position:absolute;border-radius:99px;background:#6E7F97;opacity:0;will-change:transform}
  .night .streak{background:#C9D8F5}
  .wind.left  .streak{animation-name:windL}
  .wind.right .streak{animation-name:windR}
  .streak{animation-timing-function:linear;animation-iteration-count:infinite}
  @keyframes windL{
    0%{transform:translateX(0);opacity:0}
    12%{opacity:var(--o)} 82%{opacity:var(--o)}
    100%{transform:translateX(-140vw);opacity:0}
  }
  @keyframes windR{
    0%{transform:translateX(0);opacity:0}
    12%{opacity:var(--o)} 82%{opacity:var(--o)}
    100%{transform:translateX(140vw);opacity:0}
  }
  @media (prefers-reduced-motion:reduce){ .wind{display:none} }

  .face{position:absolute;z-index:4;pointer-events:none;opacity:0;
        transition:opacity 620ms ease}
  .face.on{opacity:1}
  .face .eye{transition:transform 520ms ease, height 120ms ease}
  /* ---------------- Infoleiste ---------------- */
  .info{
    flex:0 0 auto;background:var(--panel);border-top:2.5px solid var(--ink);
    padding:16px 26px 18px;position:relative;
  }
  .meta{
    font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
    color:#6B675E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:40px;
  }
  .rare{
    display:none;margin-right:12px;color:#E24B3A;letter-spacing:.22em;
    font-weight:700;
  }
  .rare.on{display:inline;animation:rarePulse 2.6s ease-in-out infinite}
  @keyframes rarePulse{ 0%,100%{opacity:1} 50%{opacity:.42} }
  @media (prefers-reduced-motion:reduce){ .rare{animation:none} }
  .route{
    margin:5px 0 0;font-size:clamp(26px,5.2vw,50px);font-weight:800;letter-spacing:-.02em;
    line-height:1.06;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding-right:120px;
  }
  .route .arrow{font-weight:400;margin:0 .18em}
  /* Fallblatt-Anzeige wie am Flughafen */
  .route{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden;text-transform:none}
  .flap{
    position:relative;flex:0 0 auto;width:.82em;height:1.22em;
    background:#1A1A18;color:#F4F1E6;border-radius:3px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .flap.gap{background:none;width:.3em}
  .flap.wide{width:.95em}
  .flap::after{content:"";position:absolute;left:0;right:0;top:50%;
    height:1px;background:rgba(255,255,255,.22)}
  .flap b{
    display:block;font-weight:700;font-size:.8em;line-height:1;
    transform-origin:50% 0%;font-variant-numeric:tabular-nums;
  }
  .flap.turn b{animation:flap 110ms ease-in}
  @keyframes flap{0%{transform:rotateX(0)}55%{transform:rotateX(-88deg)}
    56%{transform:rotateX(88deg)}100%{transform:rotateX(0)}}
  .night .flap{background:#0E1524}
  .detail{
    margin:7px 0 0;font-family:var(--mono);font-size:12.5px;color:#4E4A42;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:120px;
  }
  .info.emerg{background:#F7E4E0;border-top-color:#C0392B}
  .info.emerg .detail{color:#8E2A1E}
  .info.emerg .route .flap{background:#7A1D12}
  .info.warn{background:#F8F1DE;border-top-color:#BE8C1C}
  .sq{font-weight:600}
  .sq.quiet{border:0;background:none;font:inherit;color:inherit;font-weight:400;
    padding:0;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;
    text-underline-offset:3px}
  .sq.quiet.open{color:#2C7A4B;font-weight:600;text-decoration:none}
  .sq.rot{color:#B3261E} .sq.gelb{color:#9A6B0C} .sq.gruen{color:#2C7A4B}
  .ok{color:#2C7A4B;letter-spacing:.16em;text-transform:uppercase}
  .reg{
    position:absolute;right:26px;bottom:14px;font-family:var(--mono);
    font-size:11px;letter-spacing:.1em;color:#9A958A;
  }
  .toast{position:absolute;z-index:8;left:50%;top:78px;transform:translateX(-50%);
    background:rgba(26,26,24,.86);color:#F4F1E6;font-family:var(--mono);
    font-size:12px;letter-spacing:.12em;padding:9px 16px;border-radius:999px;
    opacity:0;transition:opacity 600ms ease}
  .toast.on{opacity:1}
  .night .toast{background:rgba(240,243,250,.9);color:#16202F}
  .rwyplan{position:absolute;z-index:7;right:26px;bottom:26px;width:245px;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
  .rwyplan svg{width:100%;height:auto;display:block}
  .rwyplan .rw{fill:#9AA0A8;stroke:#5F6570;stroke-width:1.4}
  .rwyplan .rw.on{fill:#5FBF7E;stroke:#2E7A4C;stroke-width:1.6}
  @media (max-width:560px){ .rwyplan{width:165px;right:14px;bottom:14px} }
  .detail{cursor:pointer}
  .second{
    position:absolute;z-index:4;left:28px;top:76px;max-width:120px;
    font-family:var(--mono);font-size:11px;line-height:1.6;letter-spacing:.1em;
    color:#4A4F57;opacity:.7;pointer-events:none;
  }
  .second b{display:block;font-weight:400;text-transform:uppercase;letter-spacing:.14em}
  .second:empty{display:none}
  .night .second{color:#9FB0CC}
  @media (max-width:700px){ .second{left:16px;top:58px;font-size:10px;max-width:200px} }
  /* ---------------- Schmale Bildschirme, Handy ---------------- */
  @media (max-width:560px){
    .top{padding:10px 12px;gap:7px;font-size:9px;letter-spacing:.1em}
    .place{width:30px;height:30px}
    .place svg{width:15px;height:15px}
    .radius button{padding:2px 6px;font-size:9px}
    .here{font-size:9px}
    .craft{width:96%}
    .craft2{width:34%;left:26%;top:13%}
    .info{padding:10px 14px 12px;border-top-width:2px}
    .meta{font-size:9.5px;letter-spacing:.1em;padding-right:0}
    .route{font-size:26px;padding-right:0;gap:2px}
    .flap{width:.78em;height:1.2em;border-radius:2px}
    .detail{font-size:10px;padding-right:0;white-space:normal;line-height:1.5}
    .reg{position:static;text-align:right;margin-top:4px}
    .empty h2{font-size:22px} .empty .temp{font-size:46px}
    .tech .spec{align-self:stretch;margin:8px 14px 12px}
  }
  /* Hochformat: mehr Himmel, Flugzeug etwas kleiner */
  @media (orientation:portrait){
    .craft{max-width:none}
  }

  /* ---------------- Wetterlagen ---------------- */
  .precip{position:absolute;inset:0;z-index:1;pointer-events:none;display:none}
  .wx-rain .precip, .wx-storm .precip, .wx-drizzle .precip{display:block}
  .drop{
    position:absolute;top:-6%;width:2.3px;border-radius:99px;
    background:linear-gradient(to bottom, transparent, rgba(255,255,255,.75));
    animation:dropFall linear infinite;
  }
  .night .drop{background:linear-gradient(to bottom, transparent, rgba(210,222,255,.7))}
  @keyframes dropFall{
    0%{transform:translateY(0);opacity:0}
    8%{opacity:1} 92%{opacity:1}
    100%{transform:translateY(112vh);opacity:0}
  }
  @media (prefers-reduced-motion:reduce){ .drop{animation:none;display:none} }
  .wx-snow .precip{
    display:block;opacity:.85;
    background-image:
      radial-gradient(circle at 12% 18%, #fff 1.7px, transparent 2px),
      radial-gradient(circle at 42% 62%, #fff 1.4px, transparent 2px),
      radial-gradient(circle at 73% 32%, #fff 1.9px, transparent 2px),
      radial-gradient(circle at 88% 78%, #fff 1.4px, transparent 2px);
    background-size:120px 120px,90px 90px,150px 150px,110px 110px;
    animation:snow 9s linear infinite;
  }
  @keyframes snow{to{background-position:22px 120px,-16px 90px,14px 150px,-10px 110px}}
  .wx-fog .precip{display:block;background:linear-gradient(to bottom,
     rgba(226,228,226,.15),rgba(226,228,226,.72));}
  .sun{transition:opacity var(--t),transform var(--t)}
  .wx-overcast .sun,.wx-rain .sun,.wx-storm .sun,.wx-snow .sun,.wx-fog .sun,.wx-drizzle .sun{
    opacity:0;transform:scale(.85)}
  .cloud{transition:opacity var(--t)}
  .wx-clear .cloud.c1{opacity:.55}
  .frame.night .cloud.c1{opacity:.75}
  .wx-clear .cloud.c2,.wx-clear .cloud.c3{opacity:0}
  .wx-overcast .cloud,.wx-rain .cloud,.wx-storm .cloud,.wx-snow .cloud{fill:#E4E3DB}
  .wx-fog .cloud{opacity:.25}
  .wx-clear .bands{background:linear-gradient(to bottom,#9BB4CE 0%,#A9C0D6 20%,
    #BCCEDE 40%,#D6DBDD 60%,#E3E2D9 80%,#EAE7DC 100%)}
  .wx-overcast .bands,.wx-drizzle .bands{filter:saturate(.45) brightness(.97)}
  .wx-rain .bands{filter:saturate(.35) brightness(.9)}
  .wx-storm .bands{filter:saturate(.25) brightness(.72)}
  .wx-fog .bands{filter:saturate(.1) brightness(1.02)}
  .wx-snow .bands{filter:saturate(.25) brightness(1.04)}
  .night.wx-overcast .bands,.night.wx-drizzle .bands{filter:saturate(.5) brightness(.85)}
  .night.wx-rain .bands{filter:saturate(.4) brightness(.75)}
  .night.wx-storm .bands{filter:saturate(.3) brightness(.6)}
  .night.wx-fog .bands{filter:saturate(.2) brightness(1.15)}
  .night.wx-snow .bands{filter:saturate(.3) brightness(1.2)}
  .night .precip{opacity:.55}

  /* ---------------- Dämmerung ---------------- */
  .dusk .bands{position:relative}
  .dusk .bands::after{
    content:"";position:absolute;inset:0;opacity:var(--dusk,0);
    background:linear-gradient(to bottom,#9A5B8C 0%,#C4707A 18%,#E08A5C 38%,
      #EDA765 58%,#F0C089 78%,#E8DCC4 100%);
  }
  .dusk .sun{opacity:1 !important;transform:none !important}

  /* ---------------- Technische Zeichnung ---------------- */
  .tech{
    position:absolute;inset:0;z-index:6;display:none;flex-direction:column;
    background:#1C3563;color:#CFDCFF;font-family:var(--mono);
    background-image:
      repeating-linear-gradient(to right, rgba(255,255,255,.075) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(to bottom, rgba(255,255,255,.075) 0 1px, transparent 1px 48px);
  }
  .tech.on{display:flex}
  .tech .thead{display:flex;align-items:center;gap:14px;padding:18px 26px;
    font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#B9CBF2}
  .tech .thead .t{flex:1}
  .tech .draw{flex:1 1 auto;min-height:0;padding:8px 26px 0;overflow:hidden}
  .tech .views{display:flex;align-items:center;justify-content:center;
    gap:26px;height:100%;width:100%}
  .tech .views .v{flex:1 1 0;min-width:0;height:100%;
    display:flex;align-items:center;justify-content:center}
  .tech .views svg{max-width:100%;max-height:100%;width:auto;height:auto}
  .tech .draw .riss *{fill:none;stroke:#DCE6FF;stroke-width:2.4;stroke-linejoin:round}
  .tech .draw .dim path{fill:none;stroke:#7E93C8;stroke-width:1.2}
  .tech .draw .dim text{fill:#9FB0CC;font-size:11px;letter-spacing:.12em;
    font-family:var(--mono)}
  .tech .dims{padding:6px 26px;text-align:center;flex:0 0 auto}
  .tech .dims .bar{display:block;width:min(58%,560px);margin:0 auto 10px}
  .tech .dims .l1{font-size:15px;letter-spacing:.14em}
  .tech .dims .l2{font-size:13px;letter-spacing:.14em;color:#A9BEEC;margin-top:4px}
  .tech .spec{margin:12px 26px 22px;align-self:flex-end;border:1px solid #6E88C6;font-size:11.5px;letter-spacing:.1em}
  .tech .spec div{padding:6px 12px;border-bottom:1px solid #6E88C6;white-space:nowrap}
  .tech .spec div:last-child{border-bottom:0;color:#A9BEEC}
  .tech .rarelist{padding:0 26px;font-size:11px;letter-spacing:.08em;color:#A9BEEC;
    flex:0 0 auto;max-height:20%;overflow:auto}
  .tech .rarelist h4{margin:0 0 6px;font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;color:#7E93C8;font-weight:400}
  .tech .rarelist div{padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tech .rarelist:empty{display:none}
  .gear[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);background:#fff}
  .tech .place{background:rgba(255,255,255,.10);border-color:#8FA6DC;color:#CFDCFF}
  @media (max-width:700px){
    .tech .thead{padding:12px 16px;font-size:10px;gap:10px}
    .tech .draw svg{width:80%}
    .tech .dims .l1{font-size:13px}.tech .dims .l2{font-size:11px}
    .tech .spec{margin:8px 16px 14px;font-size:10px}
  }

  .fade{transition:opacity var(--t)}
  .fade.out{opacity:0}

  @media (max-width:700px){
    .top{padding:12px 16px;font-size:10.5px;gap:10px}
    .place{width:34px;height:34px}
    .place svg{width:17px;height:17px}
    .info{padding:12px 18px 14px}
    .meta,.detail{font-size:10.5px;padding-right:86px}
    .route{padding-right:86px}
      .reg{right:16px;bottom:10px;font-size:9.5px}
    .craft{width:88%}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:1ms !important}}
</style>
</head>

/* ============ Helfer ============ */
const $ = id => document.getElementById(id);
const rad = Math.PI/180;

function fetchJSON(url, ms=6000){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),ms);
  return fetch(url,{signal:ctl.signal,headers:{Accept:"application/json"}})
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .finally(()=>clearTimeout(t));
}
function haversine(a1,o1,a2,o2){
  const R=6371,dLat=(a2-a1)*rad,dLon=(o2-o1)*rad;
  const s=Math.sin(dLat/2)**2+Math.cos(a1*rad)*Math.cos(a2*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function bearing(a1,o1,a2,o2){
  const y=Math.sin((o2-o1)*rad)*Math.cos(a2*rad);
  const x=Math.cos(a1*rad)*Math.sin(a2*rad)-Math.sin(a1*rad)*Math.cos(a2*rad)*Math.cos((o2-o1)*rad);
  return (Math.atan2(y,x)/rad+360)%360;
}

const store={

};

/* ============ adsbdb-Cache ============ */
const CK="adsbdb-cache", TTL=30*24*3600*1000;
let cache=store.get(CK,{});
const cGet=k=>{const e=cache[k];return e&&Date.now()-e.t<TTL?e.v:undefined;};
function cSet(k,v){cache[k]={t:Date.now(),v};const ks=Object.keys(cache);
  if(ks.length>800)ks.slice(0,200).forEach(x=>delete cache[x]);store.set(CK,cache);}

/* adsbdb direkt, bei CORS-Problemen über den Umweg */
async function adsbdb(path){
  try{ return await fetchJSON("https://api.adsbdb.com/v0/"+path); }
  catch(e){
    return await fetchJSON("https://api.allorigins.win/raw?url="+
      encodeURIComponent("https://api.adsbdb.com/v0/"+path));
  }
}
async function lookupRoute(cs){
  const k="cs:"+cs, h=cGet(k); if(h!==undefined) return h;
  let out=null;
  try{
    const d=await adsbdb("callsign/"+encodeURIComponent(cs));
    const fr=d?.response?.flightroute;
    if(fr){ const pl=p=>p?cityOf(p.municipality||p.name, p.iata_code):"";
      out={airline:fr.airline?.name||null,from:pl(fr.origin),to:pl(fr.destination)}; }
  }catch(e){}
  cSet(k,out); return out;
}
async function lookupAircraft(hex){
  const k="hx:"+hex, h=cGet(k); if(h!==undefined) return h;
  let out=null;
  try{
    const d=await adsbdb("aircraft/"+encodeURIComponent(hex));
    const a=d?.response?.aircraft;
    if(a) out={manufacturer:a.manufacturer||null,type:a.type||null,icao:a.icao_type||null,reg:a.registration||null};
  }catch(e){}
  cSet(k,out); return out;
}

/* ============ Seltener Gast ============ */
const COMMON=new Set(["A319","A320","A20N","A321","A21N","B737","B738","B38M","B739","E190","E195",
  "E290","E295","AT75","AT76","DH8D","CRJ9","CRJX","B77W","B788","B789","A333","A332","A359",
  "B763","B752","B77L","A388","BCS1","BCS3","SU95"]);

/* Frachtflüge erkennt man am Rufzeichen der Frachtgesellschaften oder am
   Mustercode mit F für Freighter. */
const CARGO_CALL = new Set(["GEC","BOX","FDX","UPS","GTI","CLX","ABW","RCF","ABD","MSX",
  "QTR","SQC","CKS","TAY","BCS","NPT","CAO","CKK","AIH","ETH","MPH","SWN","IRX","EXS"]);
function isCargo(call, icao){
  const c=(call||"").slice(0,3).toUpperCase();
  const t=(icao||"").toUpperCase();
  return CARGO_CALL.has(c) || /F$|BCF|SF$|BDSF|CF$|^B74S|^MD11F/.test(t);
}

function noteType(pk,t){
  if(!t) return 3;
  const seen=store.get("seen-"+pk,{}), cut=Date.now()-30*24*3600*1000;
  let l=(seen[t]||[]).filter(x=>x>cut); const before=l.length;
  if(!l.length||Date.now()-l[l.length-1]>600000) l.push(Date.now());
  seen[t]=l.slice(-12);
  for(const k in seen){seen[k]=seen[k].filter(x=>x>cut); if(!seen[k].length) delete seen[k];}
  store.set("seen-"+pk,seen); return before;
}
const PRIVATE_JET = /^(GLF|GL5|GL6|GL7|CL30|CL35|CL60|CL64|CL65|C25|C51|C55|C56|C560|C650|C68|C700|E55|E50|E35|LJ|FA5|FA6|FA7|FA8|F2TH|PC24|BE40|H25|ASTR|G150|G280|HDJT|PRM1|MU30|SF50|CRJ2)/;
const VINTAGE = /^(DC3|C47|DC6|DC4|CVLT|CV24|JU52|AN2|B17|B25|B29|P51|T6|T28|SPIT|HURI|L18|L188|BE18|YK52|PA18|DH82|STAR|CAT)/;
function rarity(ac,info,pk){
  const type=(info&&info.icao)||ac.t||null;
  const cat=(ac.category||"").toUpperCase();
  const desc=((info&&info.type)||ac.desc||"").toLowerCase();
  const before=noteType(pk,type);
  const f=Number(ac.dbFlags||0);
  const T=(type||"").toUpperCase();

  if(cat==="A7"||/helicopter|rotorcraft/.test(desc)||
     (T&&/^(H|EC1|EC3|EC4|A109|A139|B06|B407|B412|R22|R44|R66|S76|AS35|H145|H135|EC35)/.test(T)))
    return {rare:true,kind:"heli",label:"Hubschrauber"};
  if(f&1) return {rare:true,kind:null,label:"Militär"};
  if(f&8) return {rare:true,kind:null,label:"Behörde"};
  if(VINTAGE.test(T)) return {rare:true,kind:null,label:"Oldtimer"};
  if(isCargo((ac.flight||"").trim(), T)) return {rare:true,kind:null,label:"Frachter"};
  if(PRIVATE_JET.test(T)) return {rare:true,kind:null,label:"Privatjet"};
  if(T&&!COMMON.has(T)) return {rare:true,kind:null,label:"Ungewöhnlicher Typ"};
  if(T&&before<3) return {rare:true,kind:null,label: before===0?"Erstmals hier":"Selten hier"};
  return {rare:false,kind:null,label:""};
}

   dann der Rumpf darüber - so verschwinden alle Wurzeln sauber im Rumpf.
   Der Flügel kommt zuletzt über den Rumpf, das Triebwerk über den Flügel. */

/* Heckzeichen. Liegt immer im Leitwerk, weil es zugeschnitten wird. */
function emblem(a, t){
  const w = a.ink ? "#1A1A18" : "#FFFFFF";
  const dy = t ? 8 : 0;
  switch(a.e){
    case "cross":
      return `<path d="M93 ${31+dy}h12v12h12v12h-12v12h-12v-12h-12v-12h12z" fill="${w}"/>`;
    case "circle":
      return `<circle cx="99" cy="${49+dy}" r="15" fill="${a.ec||w}"/>`;
    case "chevron":
      return `<path d="M81 ${67+dy} 99 ${29+dy} 117 ${67+dy} 99 ${57+dy}Z" fill="${w}"/>`;
    default:
      return `<rect x="77" y="${37+dy}" width="42" height="11" rx="5.5" fill="${w}"/>`
           + `<rect x="83" y="${55+dy}" width="32" height="11" rx="5.5" fill="${w}"/>`;
  }
}
let clipSeq=0;
const tail = (a, path, t) => {
  const id="fin"+(++clipSeq);
  return `<defs><clipPath id="${id}"><path d="${path}"/></clipPath></defs>
  <path d="${path}" fill="${a.c}" stroke="${LINE}" stroke-width="3.4" stroke-linejoin="round"/>
  <g clip-path="url(#${id})">${emblem(a,t)}</g>
  <path d="${path}" fill="none" stroke="${LINE}" stroke-width="3.4" stroke-linejoin="round"/>`;
};

     ganz zum Schluss das Auffangnetz für unbekannte Leichtflugzeuge.

function nearestAirport(lat, lon){
  let best=null, bk=Infinity;
  for(const a of AIRPORTS){
    const km=haversine(lat,lon,a.lat,a.lon);
    if(km<bk){ bk=km; best=a; }
  }
  return { ap:best, km:bk };
}
/* Tief, im Sinkflug und nahe an einem Flughafen: dann ist das Ziel klar,
   auch wenn die Routendatenbank noch einen alten Flugplan kennt. */
function guessRoute(ac, route){
  const ft = typeof ac.alt_baro==="number" ? ac.alt_baro : null;
  const rate = typeof ac.baro_rate==="number" ? ac.baro_rate : 0;
  if(ft===null || ft>10000) return { route, guess:null };
  const n = nearestAirport(ac.lat, ac.lon);
  if(!n.ap || n.km>45) return { route, guess:null };
  const r = route ? {airline:route.airline, from:route.from, to:route.to} : {airline:null,from:"",to:""};
  if(rate < -250 && r.to !== n.ap.name){ r.to = n.ap.name; return { route:r, guess:"Ziel geschätzt" }; }
  if(rate >  250 && r.from !== n.ap.name){ r.from = n.ap.name; return { route:r, guess:"Start geschätzt" }; }
  return { route, guess:null };
}

function logRare(placeKey, entry){
  const k="rarelog-"+placeKey;
  const cut=Date.now()-14*24*3600*1000;
  let list=store.get(k,[]).filter(e=>e.t>cut);
  if(!list.some(e=>e.reg===entry.reg && Date.now()-e.t < 6*3600*1000)) list.push(entry);
  store.set(k, list.slice(-120));
}
function rareWeek(placeKey){
  const cut=Date.now()-7*24*3600*1000;
  return store.get("rarelog-"+placeKey,[]).filter(e=>e.t>cut).reverse();
}
function countSighting(placeKey, reg){
  if(!reg) return 0;
  const k="regseen-"+placeKey;
  const m=store.get(k,{});
  m[reg]=(m[reg]||0)+1;
  const keys=Object.keys(m);
  if(keys.length>1500) delete m[keys[0]];
  store.set(k,m);
  return m[reg];
}

/* Wettercode -> Aussehen des Himmels */
function wxClass(c){
  if(c==null) return "wx-cloudy";
  if(c===0) return "wx-clear";
  if(c===1||c===2) return "wx-cloudy";
  if(c===3) return "wx-overcast";
  if(c===45||c===48) return "wx-fog";
  if(c>=51&&c<=57) return "wx-drizzle";
  if(c>=71&&c<=77||c===85||c===86) return "wx-snow";
  if(c>=95) return "wx-storm";
  if(c>=61&&c<=82) return "wx-rain";
  return "wx-cloudy";
}
/* Innerhalb einer halben Stunde um Sonnenauf- und -untergang liegt
   Dämmerung über dem Himmel, damit der Wechsel nicht springt. */
function duskFactor(w){
  if(!w||!w.sunrise||!w.sunset) return 0;
  const now=Date.now();
  const near=t=>{ const d=Math.abs(now-new Date(t).getTime())/60000; return d<30 ? 1-d/30 : 0; };
  return Math.max(near(w.sunrise), near(w.sunset));
}
function applyWeather(w){
  const dusk=duskFactor(w);
  const f=document.querySelector(".frame");
  const cls="frame "+wxClass(w?w.weather_code:null)
    + (w && w.is_day===0 ? " night" : "") + (dusk>0.1 ? " dusk" : "");
  f.className=cls;
  f.style.setProperty("--dusk", dusk.toFixed(2));
  const want = /wx-(storm|rain|drizzle)/.test(cls) ? cls.match(/wx-\S+/)[0] : null;
  if(want!==dropsFor) paintDrops(cls);
}
let weather={};
async function getWeather(p){
  if(weather.key===p.key&&Date.now()-weather.t<600000) return weather.d;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&current=temperature_2m,weather_code,is_day,wind_speed_10m,wind_direction_10m,pressure_msl&daily=sunrise,sunset&timezone=auto`;
    let d; try{ d=await fetchJSON(u); }
    catch(e){ d=await fetchJSON("https://api.allorigins.win/raw?url="+encodeURIComponent(u)); }
    const cur=Object.assign({}, d.current);
    if(d.daily && d.daily.sunrise){ cur.sunrise=d.daily.sunrise[0]; cur.sunset=d.daily.sunset[0]; }
    weather={key:p.key,t:Date.now(),d:cur}; return cur;
  }catch(e){ return weather.key===p.key?weather.d:null; }
}



/* ============ Regen als einzelne fallende Tropfen ============
   Wenige, ruhig fallende Striche statt eines flimmernden Musters.
   Nieselregen: wenig und langsam. Regen: etwas mehr und schneller.
   Gewitter: am meisten, aber immer noch zurückhaltend. */
let dropsFor=null;
function paintDrops(cls){
  const host=$("sky");
  document.querySelectorAll(".drop").forEach(d=>d.remove());
  const cfg = /wx-storm/.test(cls) ? {n:16, min:2.6, max:4.2, len:[28,42]}

            : /wx-drizzle/.test(cls)?{n:7,  min:5.5, max:8.0, len:[12,18]}
            : null;
  dropsFor = cfg ? cls.match(/wx-\S+/)[0] : null;
  if(!cfg) return;
  for(let i=0;i<cfg.n;i++){
    const d=document.createElement("i");
    d.className="drop";

    d.style.animationDuration=dur+"s";
    d.style.animationDelay="-"+(Math.random()*dur).toFixed(2)+"s";

  }
}

/* Passt die Schriftgröße der Tafel an, bis auch lange Namen wie
   "Arnavutköy, Istanbul → Amsterdam" vollständig hineinpassen. */
function fitRoute(){
  const r=$("route"); if(!r) return;
  r.style.fontSize="";

  if(!max || !r.children.length) return;
  const need=r.scrollWidth;
  if(need>max){

    r.style.fontSize=Math.max(13, cur*(max/need)*0.97).toFixed(1)+"px";

function flap(el, text){

    const d=document.createElement("div");
    d.className="flap"+(ch===" "?" gap":"")+(ch==="→"?" wide":"");

  });

  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cells.forEach((cell,i)=>{
    const ch=chars[i];

    const steps=4+(i%6);
    for(let s=0;s<steps;s++){
      flapTimers.push(setTimeout(()=>{
        const b=cell.firstChild;
        b.textContent = s===steps-1 ? ch : FLAP_CHARS[Math.floor(Math.random()*FLAP_CHARS.length)];
        cell.classList.remove("turn"); void cell.offsetWidth; cell.classList.add("turn");
      }, i*38 + s*105));

  });
}


/* ============ Wind ============
   Die Striche laufen quer über den ganzen Himmel, das Flugzeug steht mittendrin.
   Richtung: immer von der Nase zum Heck. Ob die Maschine gespiegelt gezeichnet
   ist, wird direkt am fertigen Bild abgelesen - so kann nichts auseinanderlaufen.
   Drei Stilvarianten, bei jeder Böe wird zufällig eine gewählt. */
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let craftFlipped=false, lastKmh=400, windFlip=null, windKmh=0;

function stopWind(){
  const el=$("wind"); if(!el) return;
  el.classList.remove("on"); el.innerHTML="";
}
/* Der Wind läuft durchgehend, nicht in Böen. Jeder Strich hat eine eigene
   Dauer, dadurch driften sie auseinander und die Dichte schwankt von selbst -
   mal ein einzelner, mal mehrere gleichzeitig. Die Menge hängt am Tempo. */
function setWind(kmh){
  if(REDUCED) return;
  const el=$("wind"), c=$("craft");
  if(!el||!c||c.classList.contains("hide")) return stopWind();

  const toLeft = !/scale\(-1,1\)/.test(c.innerHTML);
  const f=Math.max(.3, Math.min(1.7, (kmh||400)/650));
  const base=3.4-1.7*f;
  const n=Math.round(6+12*f);
  const style=Math.floor(Math.random()*3);

  const sky=$("sky").getBoundingClientRect(), r=c.getBoundingClientRect();
  const mid=((r.top-sky.top)+r.height/2)/sky.height*100;

  let html="";
  for(let i=0;i<n;i++){
    const spread = style===2 ? 28 : 44;
    const top=Math.max(4, Math.min(92, mid+(Math.random()-0.5)*spread));
    const len = style===0 ? (90+190*f)*(0.5+Math.random()*1.0)
              : style===1 ? (34+70*f)*(0.5+Math.random()*0.9)
              :             (150+260*f)*(0.6+Math.random()*0.8);
    const h   = style===2 ? (3.5+Math.random()*2.5) : (2+Math.random()*1.6);
    const o   = style===2 ? (0.26+Math.random()*0.16) : (0.32+Math.random()*0.34);
    const d   = (base*(0.55+Math.random()*1.6)).toFixed(2);      /* stark gestreut */
    const del = (Math.random()*base*3).toFixed(2);
    html+=`<i class="streak" style="top:${top.toFixed(1)}%;${toLeft?"left:104%":"right:104%"};
      width:${len|0}px;height:${h.toFixed(1)}px;--o:${o.toFixed(2)};
      animation-duration:${d}s;animation-delay:-${del}s"></i>`;
  }
  el.innerHTML=html;
  el.classList.remove("left","right");
  el.classList.add(toLeft?"left":"right","on");
}

/* ============ Mondphase ============
   Näherung über den mittleren synodischen Monat. Gezeichnet wird nur der
   beleuchtete Teil - der dunkle bleibt Himmel. */
let moonLit={cx:50,w:92};
function moonPhase(d){
  const ref=Date.UTC(2000,0,6,18,14);
  const days=((d||new Date()).getTime()-ref)/86400000;
  return ((days/29.530588853)%1+1)%1;
}
function drawMoon(){
  const el=$("moon"); if(!el) return;
  const p=moonPhase();
  const x=Math.cos(2*Math.PI*p);          /* +1 Neumond, -1 Vollmond */
  const rx=(Math.abs(x)*46).toFixed(1);
  const inner=x>0?0:1;
  const waxing=p<0.5;
  const d=`M50 4 A46 46 0 0 1 50 96 A${rx} 46 0 0 ${inner} 50 4 Z`;
  el.innerHTML=`<g transform="${waxing?"":"scale(-1,1) translate(-100,0)"}">
      <path d="${d}" fill="#EFEDE0"/></g>`;
  /* Lage und Breite des hellen Teils merken, damit die Augen darin sitzen */
  const te=50+46*x, cx=(te+96)/2, w=96-te;
  moonLit = waxing ? {cx:cx, w:w} : {cx:100-cx, w:w};
}
drawMoon();
setInterval(drawMoon, 3600000);

    <g id="eyes"><rect class="eye" id="eyeL" x="26" y="20" width="11" height="14" rx="5.5" fill="#1A1A18"/>

function faceHost(){
  const f=document.querySelector(".frame");
  const dark=f.classList.contains("night");
  const hidden=/wx-(overcast|rain|storm|snow|fog|drizzle)/.test(f.className);
  if(!hidden) return { el:document.querySelector(".sun"), sleepy:dark };
  const clouds=[...document.querySelectorAll(".cloud")].filter(c=>getComputedStyle(c).opacity>0.2);
  return clouds.length ? { el:clouds[Math.floor(Math.random()*clouds.length)], sleepy:false } : null;

function showFace(){
  if(REDUCED) return;
  const host=faceHost(); if(!host||!host.el) return;
  const sky=$("sky").getBoundingClientRect(), h=host.el.getBoundingClientRect();
  const el=makeFace();
  const isMoon = host.sleepy && host.el.id==="sun";
  /* Beim Mond sitzen die Augen mittig im beleuchteten Teil und rücken
     enger zusammen, je schmaler die Sichel ist. */
  const s   = isMoon ? Math.max(0.22, Math.min(1, moonLit.w/92)) : 1;
  const w   = Math.min(h.width*0.62*(isMoon?Math.max(0.5,s):1), 74);
  const midX= isMoon ? h.width*(moonLit.cx/100) : h.width/2;
  el.style.width=w+"px"; el.style.height=(w*0.6)+"px";
  el.style.left=(h.left-sky.left + midX - w/2)+"px";
  el.style.top =(h.top -sky.top  + h.height*0.42 - w*0.3)+"px";
  const L=el.querySelector("#eyeL"), R=el.querySelector("#eyeR"), G=el.querySelector("#eyes");
  const gap=28*s;
  L.setAttribute("x", (50-gap/2-11).toFixed(1));
  R.setAttribute("x", (50+gap/2).toFixed(1));
  L.setAttribute("height","14"); R.setAttribute("height","14");
  G.style.transform="translateX(0)";
  el.classList.add("on");

  const seq=[];
  if(host.sleepy){
    /* müdes Blinzeln: Augen fallen langsam zu und öffnen sich wieder */
    const blink=(t)=>{
      seq.push(setTimeout(()=>{ L.style.transition=R.style.transition="height 420ms ease";
        L.setAttribute("height","2"); R.setAttribute("height","2"); }, t));
      seq.push(setTimeout(()=>{ L.setAttribute("height","14"); R.setAttribute("height","14"); }, t+620));
    };
    blink(500); blink(1600);
    seq.push(setTimeout(()=>el.classList.remove("on"), 3000));
  }else{
    /* kurzer Blick zum Flugzeug, dann ein Zwinkern */
    const c=$("craft");
    if(c && !c.classList.contains("hide")){
      const r=c.getBoundingClientRect();
      const dir=(r.left+r.width/2) < (h.left+h.width/2) ? -1 : 1;
      seq.push(setTimeout(()=>{ G.style.transform="translateX("+(dir*7)+"px)"; }, 420));
      seq.push(setTimeout(()=>{ G.style.transform="translateX(0)"; }, 1500));
    }
    seq.push(setTimeout(()=>{ L.style.transition="height 90ms ease"; L.setAttribute("height","2"); }, 1900));
    seq.push(setTimeout(()=>{ L.setAttribute("height","14"); }, 2080));
    seq.push(setTimeout(()=>el.classList.remove("on"), 2900));
  }
}
function scheduleFace(){
  clearTimeout(faceTimer);
  const wait=70*1000;                           /* alle 70 Sekunden */
  faceTimer=setTimeout(()=>{ showFace(); scheduleFace(); }, wait);
}
if(!REDUCED) scheduleFace();

/* ============ Draufsicht für den Riss ============
   Wird aus den echten Maßen des Musters gebaut: Rumpflänge und Spannweite
   stehen im Verhältnis zueinander, Triebwerkszahl und Bauform kommen dazu.
   Dadurch stimmt der Riss für jedes Muster, ohne dass ich dreißig
   Zeichnungen von Hand anlegen muss. */
function topView(icao, kind){
  const s=SPECS[(icao||"").toUpperCase()];
  const L=s?s[0]:38, S=s?s[1]:34;
  const H=380, cx=220, y0=30;               /* Rumpf senkrecht, Nase oben */
  const px=H/L;                              /* Meter -> Bildpunkte */
  const span=Math.min(400, S*px);
  const fw=Math.max(14, Math.min(46, H*0.075*(38/L)+8));   /* Rumpfbreite */
  const half=span/2;
  const wingY=y0+H*0.52, tipY=wingY+H*0.16, rootChord=H*0.20, tipChord=H*0.05;
  const stabSpan=span*0.36, stabY=y0+H*0.93;
  const heli = kind==="heli";

  const wing=(dir)=>`M${cx+dir*fw/2} ${wingY}
    L${cx+dir*half} ${tipY} L${cx+dir*half} ${tipY+tipChord}
    L${cx+dir*fw/2} ${wingY+rootChord} Z`;
  const stab=(dir)=>`M${cx+dir*fw/2} ${stabY}
    L${cx+dir*stabSpan/2} ${stabY+H*0.045} L${cx+dir*stabSpan/2} ${stabY+H*0.075}
    L${cx+dir*fw/2} ${stabY+H*0.06} Z`;

  let eng="";
  if(!heli){
    const pos = (kind==="regional")
      ? [[0.16,wingY-H*0.05]]
      : (SPECS[(icao||"").toUpperCase()] && /^(A388|A34|B74)/.test((icao||"").toUpperCase()))
        ? [[0.32,0],[0.58,0]] : [[0.38,0]];
    for(const d of [1,-1]) for(const p of pos){
      const ex=cx+d*half*p[0], ey=(kind==="regional")? p[1] : wingY+H*0.055*(1-p[0])+H*0.02;
      eng+=`<rect x="${(ex-9).toFixed(1)}" y="${(ey-16).toFixed(1)}" width="18" height="34" rx="9"/>`;
    }
  }

  const body = heli
    ? `<ellipse cx="${cx}" cy="${y0+H*0.33}" rx="${fw*0.9}" ry="${H*0.20}"/>
       <rect x="${cx-fw*0.22}" y="${y0+H*0.5}" width="${fw*0.44}" height="${H*0.42}" rx="6"/>
       <circle cx="${cx}" cy="${y0+H*0.33}" r="${span/2}" fill="none" stroke-dasharray="6 7"/>`
    : `<path d="M${cx} ${y0} C${cx+fw*0.62} ${y0+H*0.10} ${cx+fw/2} ${y0+H*0.18} ${cx+fw/2} ${y0+H*0.30}
        L${cx+fw/2} ${y0+H*0.86} C${cx+fw/2} ${y0+H*0.95} ${cx+fw*0.18} ${y0+H} ${cx} ${y0+H}
        C${cx-fw*0.18} ${y0+H} ${cx-fw/2} ${y0+H*0.95} ${cx-fw/2} ${y0+H*0.86}
        L${cx-fw/2} ${y0+H*0.30} C${cx-fw/2} ${y0+H*0.18} ${cx-fw*0.62} ${y0+H*0.10} ${cx} ${y0}Z"/>`;

  const wings = heli ? "" : `<path d="${wing(1)}"/><path d="${wing(-1)}"/>
       <path d="${stab(1)}"/><path d="${stab(-1)}"/>`;

  /* Maßlinien */
  const dimX=cx+half+26, dimY=y0+H+30;
  const dims=`
    <path d="M${dimX} ${y0}v${H}M${dimX-6} ${y0}h12M${dimX-6} ${y0+H}h12"/>
    <text x="${dimX+9}" y="${y0+H/2}" transform="rotate(90 ${dimX+9} ${y0+H/2})">Länge ${L.toLocaleString("de-AT")} m</text>
    <path d="M${cx-half} ${dimY}h${span}M${cx-half} ${dimY-6}v12M${cx+half} ${dimY-6}v12"/>
    <text x="${cx}" y="${dimY+18}" text-anchor="middle">Spannweite ${S.toLocaleString("de-AT")} m</text>`;

  return `<svg viewBox="0 -6 ${cx*2} ${H+90}" role="img">
    <g class="riss">${body}${wings}${eng}</g>
    <g class="dim">${dims}</g></svg>`;
}

/* ============ Transpondercodes ============
   rot = Notfall, gelb = auffällig, gruen = normaler Betriebscode.
   Alles andere bleibt eine schlichte Zahl ohne Einfärbung. */
const SQUAWK = {
  "7500":["rot","Entführung"], "7600":["rot","Funkausfall"], "7700":["rot","Notfall"],
  "7777":["gelb","Militärischer Abfangflug"], "0000":["gelb","Transponderfehler"],
  "7400":["gelb","Drohne ohne Verbindung"], "7004":["gelb","Kunstflug"],
  "7001":["gelb","Militärischer Tiefflug"], "7002":["gelb","Sperrgebiet"],
  "7003":["gelb","Vorführung"], "0033":["gelb","Fallschirmabsprung"],
  "0025":["gelb","Fallschirmabsprung"], "7615":["gelb","Rettungsflug"],
  "4000":["gelb","Militärisches Übungsgebiet"], "7005":["gelb","Hochenergie-Manöver"],
  "7006":["gelb","Autonomer Betrieb (Drohne)"], "7007":["gelb","Beobachtungsflug (Open Skies)"],
  "1572":["gelb","Innenministerium · Polizeihubschrauber"],
  "1657":["gelb","ÖAMTC · Christophorus"],
  "7000":["gruen","Sichtflug"], "7010":["gruen","Platzrunde"],
  "2000":["gruen","Einflug ohne Zuweisung"], "1000":["gruen","Unter Flugsicherung"],
  "1200":["gruen","Sichtflug (Nordamerika)"], "7020":["gruen","Nahbereich"],
  "0021":["gruen","Sichtflug unter 5000 ft"]
};
/* Bereiche, die keine einzelnen Codes sind */
function squawkInfo(code){
  if(SQUAWK[code]) return SQUAWK[code];
  const n=parseInt(code,10);
  if(!isFinite(n)) return null;
  if(n>=5001 && n<=5077) return ["gelb","Österreichisches Bundesheer"];
  if(n>=1530 && n<=1539) return ["gruen","Sichtflug im Anflug auf Wien"];
  if(n>=1550 && n<=1559) return ["gruen","Sichtflug im Anflug"];
  if(n>=1 && n<=17)      return ["gruen","Platzverkehr Wien, Salzburg oder Klagenfurt"];
  if(n>=60 && n<=77)     return ["gruen","Platzverkehr Innsbruck, Linz oder Graz"];
  return null;
}

/* ============ Aktive Piste in Schwechat ============
   Aus den Kursen der tief anfliegenden Maschinen lässt sich ablesen,
   welche Bahn gerade benutzt wird. Wien hat 11/29 und 16/34. */
const RUNWAYS = [
  { name:"29", hdg:293 }, { name:"11", hdg:113 },
  { name:"16", hdg:157 }, { name:"34", hdg:337 }
];
/* Die aktive Piste wird nicht aus einer amtlichen ATIS-Quelle gelesen -
   Wien Schwechat bietet dafuer keine offene Schnittstelle. Sie wird aus
   echten, tief und im Sinkflug befindlichen Maschinen abgeleitet, die
   auf einen der vier Pistenkurse ausgerichtet sind. Das ist meistens
   richtig, aber eine Ableitung, keine offizielle Angabe - und sie kann
   veralten, wenn länger keine solche Maschine zu sehen war. */
const RWY_MAX_AGE = 3*3600*1000;
let activeRwy = store.get("rwy", null), rwyAt = store.get("rwyAt", 0), rwyShown=false;
function rwyAge(){ return Date.now()-rwyAt; }
function detectRunway(list){
  const vie=AIRPORTS[0];
  for(const ac of list){
    if(typeof ac.lat!=="number"||typeof ac.alt_baro!=="number") continue;
    if(ac.alt_baro>9000 || typeof ac.track!=="number") continue;
    if(typeof ac.baro_rate==="number" && ac.baro_rate>-150) continue;   /* nur Sinkflug */
    if(haversine(ac.lat,ac.lon,vie.lat,vie.lon)>38) continue;
    let best=null, bd=999;
    for(const r of RUNWAYS){
      const d=Math.abs(((ac.track-r.hdg+540)%360)-180);   /* Winkelabstand */
      if(d<bd){ bd=d; best=r; }
    }
    if(best && bd<18){
      activeRwy=best.name; rwyAt=Date.now();
      store.set("rwy",best.name); store.set("rwyAt",rwyAt);
      return;
    }
  }
}


/* ============ Funk: ATIS und simulierter Sprechfunk ============
   Web Speech API kann die Systemstimme nicht durch einen Filter schicken -
   wir kommen an das Audiosignal nicht heran. Die Annäherung an "Funk"
   kommt daher über Stimmwahl (tief, gleichmäßig) und Rauschen davor/danach. */
const DIGIT_WORD = ["zero","one","two","three","four","five","six","seven","eight","nine"];
const NATO = {A:"Alpha",B:"Bravo",C:"Charlie",D:"Delta",E:"Echo",F:"Foxtrot",G:"Golf",H:"Hotel",
  I:"India",J:"Juliett",K:"Kilo",L:"Lima",M:"Mike",N:"November",O:"Oscar",P:"Papa",Q:"Quebec",
  R:"Romeo",S:"Sierra",T:"Tango",U:"Uniform",V:"Victor",W:"Whiskey",X:"X-ray",Y:"Yankee",Z:"Zulu"};
const digits = s => [...s].map(c=>DIGIT_WORD[+c]||c).join(" ");

/* "AUA40H" + "Austrian" -> "Austrian four zero hotel". Ohne bekannte Airline
   wird das Rufzeichen buchstabiert: "Golf Delta Bravo Charlie Juliett". */
function spokenCallsign(call, airlineName){
  const cs=(call||"").trim().toUpperCase();
  if(!cs) return "traffic";
  if(airlineName){
    const rest=cs.slice(3).split("").map(ch=>/[0-9]/.test(ch)?DIGIT_WORD[+ch]:(NATO[ch]||ch)).join(" ");
    return airlineName+" "+rest;
  }
  return cs.split("").map(ch=>/[0-9]/.test(ch)?DIGIT_WORD[+ch]:(NATO[ch]||ch)).join(" ");
}
function windDir3(deg){ return String(Math.round((deg||0)/10)*10 % 360).padStart(3,"0").replace(/^0(?=\\d{2}$)/,"0"); }
function qnhWords(hpa){ return digits(String(Math.round(hpa||1013)).padStart(4,"0")); }

function speak(text, onend){
  if(!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-GB"; u.rate=1.02; u.pitch=0.72; u.volume=1;
  const vs=window.speechSynthesis.getVoices();
  const v=vs.find(v=>/en-GB|en_GB/.test(v.lang) && /male/i.test(v.name))
        || vs.find(v=>/en-GB|en_GB/.test(v.lang)) || vs.find(v=>/^en/.test(v.lang));
  if(v) u.voice=v;
  u.onstart=()=>$("funk").classList.add("speaking");
  u.onend=()=>{ $("funk").classList.remove("speaking"); if(onend) onend(); };
  u.onerror=()=>{ $("funk").classList.remove("speaking"); };
  beep("test");
  setTimeout(()=>window.speechSynthesis.speak(u), 220);
}

async function readAtis(){
  if(!soundOn) return;
  const w=weather.d;
  const metar=await getMetar();
  if(!w && !metar) return;

  const fresh = rwyAge() < RWY_MAX_AGE;
  const rwy = (activeRwy && fresh) ? "runway "+digits(activeRwy)+" in use" : "runway information not available";

  const windDeg = metar && metar.windDir!=null ? metar.windDir : (w?w.wind_direction_10m:null);
  const windKt  = metar ? metar.windSpd : (w?Math.round(w.wind_speed_10m||0):null);
  const wind = windKt==null ? "wind information not available"
    : (metar && metar.windDir==null ? "wind variable at "+windKt+" knots"
       : "wind "+windDir3(windDeg)+" degrees at "+windKt+" knots"
         +(metar&&metar.windGust?", gusting "+metar.windGust+" knots":""));

  let visCloud;
  if(metar && metar.cavok) visCloud="C A V O K";
  else if(metar && metar.visM!=null){
    const vis = metar.visM>=9999 ? "visibility ten kilometers or more" : "visibility "+metar.visM+" meters";
    const low = metar.clouds && metar.clouds[0];
    visCloud = vis + (low ? ", "+CLOUD_WORD[low.cover]+" at "+altWords(low.ft) : ", no significant cloud");
  } else visCloud = condName(w?w.weather_code:null)||"no significant weather";

  const temp = metar && metar.tempC!=null ? metar.tempC : (w?Math.round(w.temperature_2m):null);
  const qnhVal = metar && metar.qnh ? metar.qnh : (w?w.pressure_msl:null);

  const txt = `Vienna Information. ${rwy}. ${wind}. ${visCloud}.`+
    (temp!=null?` Temperature ${temp}.`:"")+
    (qnhVal!=null?` Q N H ${qnhWords(qnhVal)}.`:"");
  speak(txt);
}

/* ============ METAR für Wien-Schwechat ============
   Öffentliche, freie Schnittstelle der US-Wetterbehörde, liefert auch
   europäische Flughäfen im Rohtext. Liefert sie nichts Brauchbares,
   fällt die Ansage automatisch auf die Open-Meteo-Werte zurück - dann
   klingt sie etwas gröber, bleibt aber inhaltlich richtig. */
function fetchText(url, ms=6000){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),ms);
  return fetch(url,{signal:ctl.signal}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
    .finally(()=>clearTimeout(t));
}
function tempVal(s){ return s.startsWith("M") ? -parseInt(s.slice(1),10) : parseInt(s,10); }
function parseMetar(raw){
  if(!raw) return null;
  const t=raw.trim().replace(/\s+/g," "); if(!t) return null;
  const out={raw:t}; let m;
  if((m=t.match(/\b(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?KT\b/))){
    out.windDir = m[1]==="VRB" ? null : parseInt(m[1],10);
    out.windSpd = parseInt(m[2],10);
    out.windGust = m[3]?parseInt(m[3],10):null;
  }
  if(/\bCAVOK\b/.test(t)) out.cavok=true;
  else if((m=t.match(/\s(\d{4})\s/))) out.visM=parseInt(m[1],10);
  out.clouds=[...t.matchAll(/\b(FEW|SCT|BKN|OVC)(\d{3})\b/g)].map(x=>({cover:x[1],ft:parseInt(x[2],10)*100}));
  if((m=t.match(/\s(M?\d{2})\/(M?\d{2})\b/))){ out.tempC=tempVal(m[1]); out.dewC=tempVal(m[2]); }
  if((m=t.match(/\bQ(\d{4})\b/))) out.qnh=parseInt(m[1],10);
  return (out.windSpd!==undefined || out.tempC!==undefined || out.qnh!==undefined) ? out : null;
}
let metarCache={t:0,d:null};
async function getMetar(){
  if(metarCache.d && Date.now()-metarCache.t < 10*60*1000) return metarCache.d;
  try{
    const raw=await fetchText("https://aviationweather.gov/api/data/metar?ids=LOWW&format=raw");
    const p=parseMetar(raw.split("\n")[0]);
    if(p){ metarCache={t:Date.now(),d:p}; return p; }
  }catch(e){}
  return metarCache.d;   /* alter Stand ist besser als nichts, wird beim Bauen des Texts nicht neu gealtert geprüft */
}
const CLOUD_WORD={FEW:"few clouds",SCT:"scattered clouds",BKN:"broken clouds",OVC:"overcast"};
function altWords(ft){
  const h=Math.round(ft/100)*100;
  if(h%1000===0) return DIGIT_WORD[h/1000]+" thousand"+(h>=2000?" feet":" feet");
  return digits(String(h))+" feet";
}

/* Töne werden im Browser erzeugt, keine Dateien. iOS lässt Ton erst nach
   einer Berührung zu - deshalb wird der Kontext beim ersten Tippen geweckt. */
let actx=null, audioUnlocked=false;
function audio(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(actx.state==="suspended") actx.resume();
  return actx;
}
/* iOS gibt Ton erst nach einer Berührung frei, und der Kontext schläft nach
   einer Weile im Hintergrund wieder ein. Deshalb bei jeder Berührung neu
   wecken - nicht nur beim ersten Mal - und einmal einen stummen Puffer
   abspielen, was Safari zum vollständigen Freischalten braucht. */
function unlockAudio(){
  const c=audio(); if(!c) return;
  if(!audioUnlocked){
    try{
      const b=c.createBuffer(1,1,c.sampleRate);
      const s=c.createBufferSource(); s.buffer=b;
      s.connect(c.destination); s.start(0);
      audioUnlocked=true;
    }catch(e){}
  }
}
addEventListener("touchstart", unlockAudio, {passive:true});
addEventListener("touchend", unlockAudio, {passive:true});
addEventListener("click", unlockAudio);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) audio(); });

function beep(kind){
  if(!soundOn) return;
  const c=audio(); if(!c) return;
  const t=c.currentTime;
  if(kind==="rare" || kind==="rare2" || kind==="test"){
    /* Funkgeräusch: kurzer Rauschstoß mit "Squelch"-Klick an Anfang und Ende
       (das kurze Knacken, wenn ein Funkgerät öffnet und schließt), dazwischen
       gefiltertes Rauschen mit leisem Trägerton statt hartem Ein-/Ausblenden. */
    const len = kind==="test" ? 0.55 : kind==="rare2" ? 0.75 : 1.15;
    const buf=c.createBuffer(1, Math.floor(c.sampleRate*len), c.sampleRate);
    const dat=buf.getChannelData(0);
    const syl=[]; let pos=0.09;
    while(pos<len-0.14){ const d=0.07+Math.random()*0.14; syl.push([pos,d]); pos+=d+0.03+Math.random()*0.08; }
    for(let i=0;i<dat.length;i++){
      const t=i/c.sampleRate;
      let env=0.16;
      for(const [s,d] of syl){
        if(t>=s && t<=s+d){ const u=(t-s)/d; env=Math.max(env, 0.6*Math.sin(Math.PI*u)); }
      }
      const fade=Math.min(1, t/0.05, (len-t)/0.09);
      const carrier=Math.sin(2*Math.PI*440*t)*0.05;         /* leiser Trägerton */
      dat[i]=((Math.random()*2-1)*env + carrier)*fade;
    }
    const s=c.createBufferSource(); s.buffer=buf;
    const hp=c.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=500;
    const lp=c.createBiquadFilter(); lp.type="lowpass";  lp.frequency.value=2400;
    const g=c.createGain(); g.gain.value = kind==="rare2" ? 0.035 : 0.10;
    if(kind==="rare2"){ hp.frequency.value=320; lp.frequency.value=1500; }
    s.connect(hp).connect(lp).connect(g).connect(c.destination); s.start(t);

    /* Squelch-Klicks: ein sehr kurzer, härterer Knack am Anfang und am Ende */
    (kind==="rare2" ? [] : [0, len-0.02]).forEach(off=>{
      const cbuf=c.createBuffer(1, Math.floor(c.sampleRate*0.012), c.sampleRate);
      const cd=cbuf.getChannelData(0);
      for(let i=0;i<cd.length;i++) cd[i]=(Math.random()*2-1)*(1-i/cd.length);
      const cs=c.createBufferSource(); cs.buffer=cbuf;
      const cg=c.createGain(); cg.gain.value=0.22;
      cs.connect(cg).connect(c.destination); cs.start(t+off);
    });
  } else if(kind==="alarm"){
    /* kurze zweitönige Sirene */
    [[740,0],[560,0.28],[740,0.56]].forEach(([f,dt])=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+dt);
      g.gain.exponentialRampToValueAtTime(0.13,t+dt+0.04);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dt+0.26);
      o.connect(g).connect(c.destination); o.start(t+dt); o.stop(t+dt+0.3);
    });
  }
}

async function showPlane(ac, second){
  const call=(ac.flight||"").trim();
  let [route,info]=await Promise.all([
    call?lookupRoute(call):Promise.resolve(null), lookupAircraft(ac.hex)
  ]);
  const rare=rarity(ac,info,place.key);
  const kind=kindOf(ac,info,rare);
  const g = guessRoute(ac, route);
  route = g.route;
  let a=airlineOf(call,(info&&info.reg)||ac.r||"",kind);
  const flipped=((ac.track||90)%360)>180;
  const changed=shownHex!==ac.hex;
  shownHex=ac.hex;
  craftFlipped = flipped;
  lastKmh = typeof ac.gs==="number" ? Math.round(ac.gs*1.852) : 400;

  const icao=(info&&info.icao)||ac.t||"";
  const f=features(icao); f.cargo=isCargo(call,icao); f.liv=liveryOf(call); f.icao=icao;
  /* Fahrwerk kommt beim Anflug etwa ab 2500 Fuß über Grund heraus.
     Hubschrauber haben Kufen und bleiben davon unberührt. */
  f.gear = kind!=="heli" && typeof ac.alt_baro==="number" && ac.alt_baro<2500
           && (typeof ac.baro_rate!=="number" || ac.baro_rate<-100);
  const paint=()=>{
    /* Läuft noch eine Böe aus der alten Blickrichtung, sofort abbrechen -
       sonst zieht der Wind kurz in die falsche Richtung. */
    if(flipped!==windFlip || changed || Math.abs((lastKmh||0)-windKmh)>60){
      windFlip=flipped; windKmh=lastKmh; stopWind();
      requestAnimationFrame(()=>setWind(lastKmh));
    }
    /* Militärische Maschinen bekommen Heeresgrün statt Airline-Farbe.
       Erkannt am ADS-B-Militärkennzeichen oder am Bundesheer-Squawk. */
    const sq0=(ac.squawk||"").trim();
    const milSq = /^50[0-7][0-9]$/.test(sq0) && parseInt(sq0,10)>=5001 && parseInt(sq0,10)<=5077;
    if((Number(ac.dbFlags||0)&1) || milSq) a = Object.assign({}, a, {c:"#4A5A3E"});
    const sig=[kind,a.c,a.e,flipped,f.engines,f.winglet,f.nose,f.cargo,f.eng,f.liv,f.finKink,f.gear,isNight()].join("|");
    if(sig!==craftSig){ craftSig=sig; $("craft").innerHTML=craftSVG(kind,a,flipped,f); }
    $("craft").style.width=craftWidth(f.len)+"%";
    /* Je höher die Maschine fliegt, desto weiter oben steht sie im Bild.
       Der Bereich ist so gewählt, dass sie immer gut sichtbar bleibt. */
    const m = typeof ac.alt_baro==="number" ? ac.alt_baro*0.3048 : 3000;
    const t = Math.max(0, Math.min(1, Math.log10(1+m/120)/Math.log10(1+12000/120)));
    /* Ist eine zweite Maschine im Bild, bleibt die große weiter unten,
       damit sie die kleine nicht überdeckt. Der Höhenunterschied bleibt
       erkennbar, nur der Spielraum ist kleiner. */
    const lo = second ? 68 : 66, hi = second ? 52 : 30;
    $("craft").style.top = (lo - t*(lo-hi)).toFixed(1)+"%";
    $("craft").classList.remove("hide");

    /* zweite Maschine ohne zusätzliche Abfragen, nur aus den ADS-B-Feldern */
    const c2=$("craft2");
    if(second){
      const s=second.ac, call2=(s.flight||"").trim();
      const t2=(s.t||"").toUpperCase();
      const isHeli2 = (s.category||"").toUpperCase()==="A7"
        || /^(H|EC1|EC3|EC4|A109|A139|B06|B407|B412|R22|R44|R66|S76|AS35|H145|H135|EC35)/.test(t2);
      const r2={kind: isHeli2 ? "heli" : null};
      const k2=kindOf(s,null,r2);
      const a2=airlineOf(call2,s.r||"",k2);
      const f2=features(s.t||""); f2.cargo=isCargo(call2, s.t||""); f2.liv=liveryOf(call2); f2.icao=s.t||"";
      c2.innerHTML=craftSVG(k2,a2,((s.track||90)%360)>180,f2);
      c2.classList.remove("hide");
      /* Auch die Maschine im Hintergrund darf sich melden, aber deutlich leiser */
      if(s.hex!==secondHex){
        secondHex=s.hex;
        const r2b=rarity(s,{icao:s.t},place.key);
        if(r2b.rare) beep("rare2");
      }
      const b2=[];
      if(typeof s.alt_baro==="number") b2.push(thou(s.alt_baro*0.3048)+" m");
      if(typeof s.gs==="number") b2.push(Math.round(s.gs*1.852)+" km/h");
      const line2=[s.t||"", dec1(second.km)+" km im "
        +dirOf(bearing(place.lat,place.lon,s.lat,s.lon)), b2.join(" · ")]
        .filter(Boolean).join(" · ");
      $("second").innerHTML="<b>"+((a2.n?a2.n+" ":"")+(call2||"unbekannt"))+"</b>"+line2;
    } else { c2.classList.add("hide"); $("second").innerHTML=""; secondHex=null; }
    requestAnimationFrame(placeSecond);
    $("empty").classList.remove("show");


    const typeName=info&&(info.type||info.icao)
      ? (info.manufacturer?info.manufacturer+" "+info.type:(info.type||info.icao))
      : (ac.desc||ac.t||"");
    const airlineName=(route&&route.airline)||a.n||"";
    $("metaText").textContent=[airlineName,call,typeName].filter(Boolean).join(" · ").toUpperCase();
    $("rare").textContent = rare.rare ? ("Seltener Gast"+(rare.label?" · "+rare.label:"")+" ·") : "";
    $("rare").classList.toggle("on",rare.rare);
    if(rare.rare && changed) beep("rare");
    const bigText = route&&route.from&&route.to
      ? route.from+" → "+route.to
      : (typeName || call || "Unbekannter Flug");
    if(bigText!==lastBig || Date.now()-lastFlapAt > FLAP_IDLE){
      lastBig=bigText; lastFlapAt=Date.now();
      flap($("route"), bigText);
    }

    const km=haversine(place.lat,place.lon,ac.lat,ac.lon);
    const brg=bearing(place.lat,place.lon,ac.lat,ac.lon);
    const bits=[];
    if(typeof ac.alt_baro==="number") bits.push(thou(ac.alt_baro*0.3048)+" m hoch");
    if(typeof ac.gs==="number") bits.push(Math.round(ac.gs*1.852)+" km/h");
    bits.push(dec1(km)+" km im "+dirOf(brg));
    const sq=(ac.squawk||"").trim();
    const sqInfo = squawkInfo(sq);
    const tier = sqInfo ? sqInfo[0] : null;
    $("info").classList.toggle("emerg", tier==="rot");
    $("info").classList.toggle("warn", tier==="gelb");
    if(tier==="rot" && changed) beep("alarm");
    let ph=phase(ac.baro_rate);
    const nearAp=nearestAirport(ac.lat,ac.lon);
    if(typeof ac.alt_baro==="number" && ac.alt_baro<13000 && nearAp.km<40){
      if(ac.baro_rate<-250) ph="im Anflug auf "+nearAp.ap.name;
      else if(ac.baro_rate>250) ph="nach dem Start in "+nearAp.ap.name;
    }
    if(ph) bits.push(ph);
    if(g.guess) bits.push(g.guess);
    /* Die aktive Piste interessiert nur beim Anflug auf Wien: entweder ist
       Wien das Ziel, oder die Maschine sinkt in der Nähe des Flughafens. */
    const zielWien = route && /^Wien/.test(route.to||"");
    const zeigtPiste = activeRwy && rwyAge()<RWY_MAX_AGE && ac.baro_rate<-150 &&
      (ph==="im Anflug auf Wien" || (zielWien && nearAp.ap && nearAp.ap.iata==="VIE" && nearAp.km<60));
    if(zeigtPiste){
      const min=Math.round(rwyAge()/60000);
      bits.push("Piste "+activeRwy+" aktiv"+(min>=1?" · seit "+(min<60?min+" Min.":Math.round(min/60)+" Std."):""));
    }
    rwyShown = !!zeigtPiste;
    if(changed) maybeAtcCall(ac, route&&route.airline||a.n, call, zeigtPiste);
    let html=bits.join(" · ");
    if(sq){
      /* Auffällige Codes stehen sofort im Klartext, normale erst auf Tipp. */
      const meaning = sqInfo ? sqInfo[1] : "laufende Nummer der Flugsicherung";
      html += tier==="rot"||tier==="gelb"
        ? ` · <span class="sq ${tier}">Squawk ${sq} · ${meaning}</span>`
        : ` · <button class="sq quiet" data-code="Squawk ${sq}" data-mean="${meaning}">Squawk ${sq}</button>`;
    }
    $("detail").innerHTML=html;

    $("reg").textContent=(info&&info.reg)||ac.r||"";
    const regNow=(info&&info.reg)||ac.r||"";
    if(changed){
      sightings=countSighting(place.key, regNow);
      if(rare.rare) logRare(place.key,{ t:Date.now(), reg:regNow,
        type:(info&&info.icao)||ac.t||"", name:(a.n||airlineName||call||"") });
    }
    last={kind,a,typeName,icao:(info&&info.icao)||ac.t||null,
          reg:regNow, call, sightings, guess:g.guess, hex:ac.hex};
    if($("tech").classList.contains("on")) paintTech();
  };

  if(changed){
    $("craft").classList.add("hide"); $("info").classList.add("out");
    await new Promise(r=>setTimeout(r,300));
    paint(); $("info").classList.remove("out");
  } else paint();
}

/* ============ Daten ============ */
/* Quellen nacheinander, nicht alle gleichzeitig - das schont die
   Freiwilligennetze und ihre Ratelimits. Sobald eine etwas liefert,
   ist Schluss. Liefert eine nur eine leere Liste, wird die nächste
   gefragt, weil jedes Netz eigene Empfänger hat. */
let srcStatus = "";
const errName = e => { const m=String(e&&e.message||e);
  return /^\d+$/.test(m) ? "HTTP "+m : "blockiert"; };

async function planes(){
  const la=place.lat.toFixed(4), lo=place.lon.toFixed(4), nm=RADIUS_NM().toFixed(1);
  const notes=[]; let best=[], ok=0;
  if(MY_PROXY){
    try{
      const d=await fetchJSON(`${MY_PROXY}?lat=${la}&lon=${lo}&dist=${nm}`, 9000);
      best=d.ac||d.aircraft||[];
      srcStatus="Worker über "+(d.src||"?")+" · "+best.length
        + (d.error?" ("+String(d.error).replace(/\s+/g," ").slice(0,110)+")":"");
      return { list:best, ok:1 };
    }catch(e){ notes.push("Worker "+errName(e)); }
  }
  for(const s of DIRECT){
    try{
      const d=await fetchJSON(s.url(la,lo,nm), s.ms);
      const list=d.ac||d.aircraft||[];
      ok++; notes.push(s.n+" "+list.length);
      if(list.length){ best=list; break; }   /* leer? dann das nächste Netz fragen */
    }catch(e){ notes.push(s.n+" "+errName(e)); }
  }
  if(!ok){                                   /* keine einzige Antwort - Umwege */
    for(const s of PROXIED){
      try{
        const d=await fetchJSON(s.url(la,lo,nm), s.ms);
        best=d.ac||d.aircraft||[]; ok++; notes.push(s.n+" "+best.length); break;
      }catch(e){ notes.push(s.n+" "+errName(e)); }
    }
  }
  srcStatus=notes.join(" · ");
  if(!ok) throw new Error(srcStatus);
  return { list:best, ok };
}

/* Nach Entfernung sortiert. Meldungen, deren Position älter als 25 s ist,
   fliegen raus - sonst klebt eine längst weggeflogene Maschine im Bild. */
function ranked(list){
  const out=[];
  for(const ac of list){
    if(typeof ac.lat!=="number"||typeof ac.lon!=="number") continue;
    if(ac.alt_baro==="ground"||ac.gs===0) continue;
    if(typeof ac.alt_baro==="number"&&ac.alt_baro<300) continue;
    if(typeof ac.seen_pos==="number"&&ac.seen_pos>25) continue;
    const km=haversine(place.lat,place.lon,ac.lat,ac.lon);
    if(km<=RADIUS_KM) out.push({ac,km});
  }
  out.sort((a,b)=>a.km-b.km);
  return out;
}

async function tick(){
  if(DEMO) return demoTick();
  const g=gen;
  status("load");
  try{
    const {list,ok}=await planes();
    status("ok");
    if(g!==gen) return;              /* Standort wurde inzwischen gewechselt */
    const near=ranked(list); lastOk=Date.now(); detectRunway(list);
    if(near.length){
      /* Wetter zuerst - die Zeichnung braucht die Info, ob gerade Nacht ist */
      applyWeather(await getWeather(place));
      if(g!==gen) return;
      await showPlane(near[0].ac, near[1]); }
    else await showEmpty(null, list.length, ok);
  }catch(e){
    if(g!==gen) return;
    if(String(e&&e.name)==="ReferenceError"||String(e&&e.name)==="TypeError"){
      $("detail").textContent="Fehler in der Anzeige: "+e.message; return;
    }
    /* Kurze Aussetzer nicht ins Bild schreiben - erst nach einer Minute
       ohne brauchbare Antwort auf die Fehleranzeige wechseln. */
    status("err");
    if(lastOk && Date.now()-lastOk < 60000) return;
    await showEmpty("Keine Quelle erreichbar · "+srcStatus);
  }
}
function loop(){ clearInterval(timer); tick(); timer=setInterval(tick, DEMO?6000:REFRESH_MS); }

function markActive(which){
  $("btn-0").setAttribute("aria-pressed",String(which===0));
  $("btn-1").setAttribute("aria-pressed",String(which===1));
  $("btn-geo").setAttribute("aria-pressed",String(which==="geo"));
}
function applyPlace(p, which){
  place=p; gen++; markActive(which);
  $("here").textContent="Der Himmel über "+place.name;
  shownHex=null; last=null; weather={}; loop();
}
function selectPlace(i){ store.set("place",i); applyPlace(PLACES[i], i); }

/* Aktueller Standort. Braucht HTTPS - über http vom Pi verweigert Safari den Zugriff. */
function useGeo(){
  const back=()=>setTimeout(()=>{$("here").textContent="Der Himmel über "+place.name;},3500);
  if(!navigator.geolocation){ $("here").textContent="Standort wird nicht unterstützt"; return back(); }
  $("here").textContent="Standort wird bestimmt …";
  navigator.geolocation.getCurrentPosition(
    pos=>applyPlace({key:"geo",name:"deinem Standort",
                     lat:pos.coords.latitude,lon:pos.coords.longitude},"geo"),
    err=>{ $("here").textContent = err.code===1 ? "Standortzugriff abgelehnt"
             : err.code===3 ? "Standortsuche dauert zu lange" : "Standort nicht gefunden";
           back(); },
    {enableHighAccuracy:false, timeout:9000, maximumAge:300000});
}

/* ============ Technische Zeichnung ============ */
let last = null;
const numDe = n => n.toLocaleString("de-AT",{maximumFractionDigits:1});
/* Der Textblock darf die zweite Maschine nie überdecken: Er endet immer
   ein Stück vor deren linkem Rand. Bleibt zu wenig Platz, entfällt er. */
function placeSecond(){
  const s=$("second"), c2=$("craft2"), sky=$("sky");
  if(!s || !s.innerHTML) return;
  s.style.visibility="";
  if(!c2 || c2.classList.contains("hide")) { s.style.maxWidth="270px"; return; }
  const a=sky.getBoundingClientRect(), b=c2.getBoundingClientRect();
  const left=parseFloat(getComputedStyle(s).left)||28;
  const room=(b.left-a.left)-left-16;
  if(room<110){ s.style.visibility="hidden"; return; }
  s.style.maxWidth=Math.min(room,300)+"px";
}
addEventListener("resize", placeSecond);

function paintTech(){
  if(!last){
    $("techDraw").innerHTML="";
    $("techL1").textContent="Kein Flugzeug in Reichweite";
    $("techL2").textContent=""; $("techL3").textContent="";
    $("techT1").textContent="Typ: —";
    $("techT2").textContent="Kennzeichen: —";
    $("techT3").textContent="Schematische Darstellung · Daten: adsb.fi · "+VERSION;
    $("techT4").textContent="";
    $("rareList").innerHTML="";
    return;
  }
  $("techDraw").innerHTML =
    '<div class="views"><div class="v">'+craftSVG(last.kind,last.a,false)+
    '</div><div class="v">'+topView(last.icao,last.kind)+'</div></div>';
  const s=SPECS[last.icao];
  if(s){
    $("techL1").textContent=numDe(s[2])+" t maximale Abflugmasse";
    $("techL2").textContent="Erstflug des Musters "+s[3];
  }else{
    $("techL1").textContent="Keine Maße hinterlegt";
    $("techL2").textContent=last.icao?("Muster "+last.icao):"";
  }
  const seat=SEATS[last.icao];
  $("techL3").textContent = seat===undefined ? ""
    : (typeof seat==="string" ? seat+" · keine Sitzplätze"
                              : "Typisch rund "+seat+" Sitzplätze");
  $("techT1").textContent="Typ: "+(last.typeName||last.icao||"unbekannt").toUpperCase();
  $("techT2").textContent="Kennzeichen: "+[last.reg,last.call].filter(Boolean).join(" · ").toUpperCase();
  $("techT3").textContent="Schematische Darstellung · Daten: adsb.fi · "+VERSION;
  $("techT4").textContent = last.sightings>1
    ? "Zum "+last.sightings+". Mal über dir"
    : "Erstmals über dir";
  const week=rareWeek(place.key);
  $("rareList").innerHTML = week.length
    ? "<h4>Seltene Gäste dieser Woche</h4>" + week.slice(0,10).map(e=>{
        const d=new Date(e.t);
        const day=d.toLocaleDateString("de-AT",{weekday:"short"});
        const hm=d.toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"});
        return "<div>"+day+" "+hm+" · "+(e.name||"unbekannt")+(e.type?" · "+e.type:"")
             + (e.reg?" · "+e.reg:"")+"</div>";
      }).join("")
    : "";
}
function toggleTech(on){
  const t=$("tech");
  const show = on===undefined ? !t.classList.contains("on") : on;
  t.classList.toggle("on",show);
  $("btn-tech").setAttribute("aria-pressed",String(show));
  if(show){ clock(); paintTech(); }
}

/* Tipp auf einen unauffälligen Squawk zeigt seine Bedeutung. Nochmal
   tippen blendet sie wieder aus, sonst verschwindet sie nach fünf Sekunden. */
let sqTimer=null, rwyTimer=null;
$("detail").addEventListener("click",(e)=>{
  const b=e.target.closest(".sq.quiet");
  if(!b) return;
  e.stopPropagation();
  clearTimeout(sqTimer);
  const open=b.classList.toggle("open");
  b.textContent = open ? b.dataset.code+" · "+b.dataset.mean : b.dataset.code;
  if(open) sqTimer=setTimeout(()=>{
    if(b.isConnected && b.classList.contains("open")){
      b.classList.remove("open"); b.textContent=b.dataset.code;
    }
  }, 5000);
}, true);

/* Tipp auf die Detailzeile zeigt den Pistenplan */
$("detail").addEventListener("click",(e)=>{
  if(e.target.closest(".sq.quiet")) return;
  const p=$("rwyPlan");
  if(!activeRwy || !rwyShown) return;
  const show=p.hidden;
  p.hidden=!show;
  if(show){
    $("rw1129").classList.toggle("on", activeRwy==="11"||activeRwy==="29");
    $("rw1634").classList.toggle("on", activeRwy==="16"||activeRwy==="34");
    const min=Math.round(rwyAge()/60000);
    $("rwyNote").textContent="PISTE "+activeRwy+
      (min>=1 ? " · SEIT "+(min<60?min+" MIN.":Math.round(min/60)+" STD.") : " · GERADE BESTÄTIGT");
    clearTimeout(rwyTimer);
    rwyTimer=setTimeout(()=>{ p.hidden=true; }, 10000);
  }else{
    clearTimeout(rwyTimer);
  }
});

/* Kurzer Rückblick beim Öffnen: was hat sich seit gestern angesammelt? */
(function(){
  const cut=Date.now()-24*3600*1000;
  const n=store.get("rarelog-"+PLACES[0].key,[]).concat(store.get("rarelog-"+PLACES[1].key,[]))
    .filter(e=>e.t>cut).length;
  if(!n) return;
  const el=$("toast");
  el.textContent = n===1 ? "Seit gestern: 1 seltener Gast" : "Seit gestern: "+n+" seltene Gäste";
  el.hidden=false;
  setTimeout(()=>el.classList.add("on"), 400);
  setTimeout(()=>{ el.classList.remove("on"); setTimeout(()=>el.hidden=true, 700); }, 6500);
})();
selectPlace(Math.min(1,Math.max(0,store.get("place",0))));
